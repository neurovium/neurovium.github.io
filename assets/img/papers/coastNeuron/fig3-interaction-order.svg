<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Three spins coupled only by a three-body term carry 0.823 bits of connected third-order information and no pairwise structure. A coincidence projection turns 0.261 bits of it into an ordinary pairwise dependency; a parity projection turns all 0.823 bits into pairwise." font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="f3-ah" orient="auto" markerWidth="10" markerHeight="10" refX="8" refY="5" overflow="visible"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6270"/></marker>
</defs>
<rect width="1200" height="680" fill="#FCFCFB"/>
<text x="40" y="52" font-size="28" font-weight="600" fill="#1B1F26">A third-order dependency can look pairwise after projection</text>
<text x="40" y="82" font-size="16" fill="#5B6270">Same three spins, same coupling. Only the ruler — the many-to-one map onto observables — changes.</text>

<!-- fine scale: triad -->
<text x="40" y="150" font-size="18" font-weight="600" fill="#D9643A">Fine ruler · three spins, one 3-body coupling</text>
<polygon points="240,250 130,450 350,450" fill="#D9643A" fill-opacity="0.14" stroke="#D9643A" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round"/>
<rect x="128" y="371" width="224" height="32" rx="6" fill="#FCFCFB" fill-opacity="0.94"/>
<text x="240" y="393" font-size="16" font-weight="500" fill="#D9643A" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">P ∝ exp(K s₁s₂s₃)</text>
<g fill="#D9643A" stroke="#FCFCFB" stroke-width="3">
<circle cx="240" cy="250" r="30"/><circle cx="130" cy="450" r="30"/><circle cx="350" cy="450" r="30"/>
</g>
<g font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">
<text x="240" y="257">s₁</text><text x="130" y="457">s₂</text><text x="350" y="457">s₃</text>
</g>
<text x="240" y="520" font-size="15" fill="#1B1F26" text-anchor="middle">Every pair marginal is uniform: a pairwise model sees <tspan font-weight="600">nothing</tspan>.</text>
<text x="240" y="562" font-size="26" font-weight="600" fill="#D9643A" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">I⁽³⁾ = 0.823 bits</text>
<text x="240" y="588" font-size="13" fill="#5B6270" text-anchor="middle">connected third-order information at K = 1.8 (exact enumeration)</text>

<!-- arrows to the two projections -->
<path d="M430 350 C520 350 560 262 660 262" fill="none" stroke="#5B6270" stroke-width="2" marker-end="url(#f3-ah)"/>
<path d="M430 350 C520 350 560 492 660 492" fill="none" stroke="#5B6270" stroke-width="2" marker-end="url(#f3-ah)"/>
<text x="548" y="236" font-size="13" fill="#5B6270" text-anchor="middle">project</text>
<text x="548" y="530" font-size="13" fill="#5B6270" text-anchor="middle">project</text>

<!-- coincidence projection -->
<rect x="680" y="160" width="480" height="200" rx="10" fill="#FFFFFF" stroke="#E6E5E1"/>
<text x="704" y="192" font-size="16" font-weight="600" fill="#1A73A8">Coincidence map</text>
<text x="704" y="214" font-size="14" fill="#5B6270" font-family="'IBM Plex Mono', Menlo, monospace">x = b₁,  z = b₂ ∧ b₃      (bᵢ = (sᵢ+1)/2)</text>
<line x1="790" y1="290" x2="1050" y2="290" stroke="#1A73A8" stroke-width="4"/>
<g fill="#1A73A8" stroke="#FFFFFF" stroke-width="3">
<circle cx="790" cy="290" r="26"/><circle cx="1050" cy="290" r="26"/>
</g>
<g font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">
<text x="790" y="296">x</text><text x="1050" y="296">z</text>
</g>
<text x="920" y="254" font-size="15" font-weight="600" fill="#1A73A8" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">I(x; z) = 0.261 bits</text>
<text x="920" y="340" font-size="13" fill="#5B6270" text-anchor="middle">Part of the 3-body structure now reads as pairwise.</text>

<!-- parity projection -->
<rect x="680" y="390" width="480" height="200" rx="10" fill="#FFFFFF" stroke="#E6E5E1"/>
<text x="704" y="422" font-size="16" font-weight="600" fill="#1A73A8">Parity map</text>
<text x="704" y="444" font-size="14" fill="#5B6270" font-family="'IBM Plex Mono', Menlo, monospace">x = b₁,  z = 𝟙[b₂ = b₃]</text>
<line x1="790" y1="520" x2="1050" y2="520" stroke="#1A73A8" stroke-width="11" stroke-linecap="round"/>
<g fill="#1A73A8" stroke="#FFFFFF" stroke-width="3">
<circle cx="790" cy="520" r="26"/><circle cx="1050" cy="520" r="26"/>
</g>
<g font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">
<text x="790" y="526">x</text><text x="1050" y="526">z</text>
</g>
<text x="920" y="482" font-size="15" font-weight="600" fill="#1A73A8" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">I(x; z) = 0.823 bits = I⁽³⁾</text>
<text x="920" y="562" font-size="13" fill="#5B6270" text-anchor="middle"><tspan font-weight="600" fill="#1B1F26">All</tspan> of the 3-body structure now reads as pairwise.</text>
<text x="920" y="580" font-size="13" fill="#5B6270" text-anchor="middle">Nothing was created; only its order changed.</text>

<text x="600" y="644" font-size="14" fill="#1B1F26" text-anchor="middle">At K = 0 both projections give 0 bits, so the pairwise information is entirely the coarse-grained shadow of the triad.</text>
<text x="600" y="666" font-size="14" fill="#5B6270" text-anchor="middle">Interaction order is a property of the observables you keep, not an invariant of the system.</text>
</svg>
