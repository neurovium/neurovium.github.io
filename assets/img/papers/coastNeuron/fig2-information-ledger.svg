<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="The output entropy S_tot is partitioned into direct information I_dir, higher-order residual I_higher and irreducible uncertainty S_true. I_avail is I_dir plus I_higher. R divides I_dir by S_tot; F divides I_dir by I_avail." font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="560" fill="#FCFCFB"/>
<text x="40" y="52" font-size="28" font-weight="600" fill="#1B1F26">The information ledger at one ruler ε</text>
<text x="40" y="82" font-size="16" fill="#5B6270">Output uncertainty splits exactly into what a direct model captures, what needs joint terms, and what nothing at this ruler can explain.</text>

<!-- S_tot line -->
<line x1="80" y1="128" x2="1120" y2="128" stroke="#1B1F26" stroke-width="1.5"/>
<line x1="80" y1="122" x2="80" y2="134" stroke="#1B1F26" stroke-width="1.5"/>
<line x1="1120" y1="122" x2="1120" y2="134" stroke="#1B1F26" stroke-width="1.5"/>
<text x="600" y="118" font-size="14" font-weight="500" fill="#1B1F26" text-anchor="middle"><tspan font-family="'IBM Plex Mono', Menlo, monospace">S_tot = H(Y)</tspan>  ·  total output uncertainty</text>

<!-- I_avail bracket -->
<path d="M80 156 L80 148 L758 148 L758 156" fill="none" stroke="#5B6270" stroke-width="1.5"/>
<text x="419" y="170" font-size="13" fill="#5B6270" text-anchor="middle"><tspan font-family="'IBM Plex Mono', Menlo, monospace" font-weight="500">I_avail = I(Y; X_ε) = I_dir + I_higher</tspan>  ·  all the inputs at this ruler could tell you</text>

<!-- main bar -->
<rect x="80" y="184" width="468" height="64" rx="4" fill="#1A73A8"/>
<rect x="550" y="184" width="208" height="64" rx="4" fill="#D9643A"/>
<rect x="760" y="184" width="360" height="64" rx="4" fill="#C9C8C2"/>
<text x="314" y="211" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">I_dir</text>
<text x="314" y="232" font-size="12" fill="#FFFFFF" text-anchor="middle">captured by the best additive model</text>
<text x="654" y="211" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">I_higher</text>
<text x="654" y="232" font-size="12" fill="#FFFFFF" text-anchor="middle">needs joint terms</text>
<text x="940" y="211" font-size="16" font-weight="600" fill="#1B1F26" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">S_true = H(Y | X_ε)</text>
<text x="940" y="232" font-size="12" fill="#1B1F26" text-anchor="middle">irreducible at this ruler</text>

<!-- S_dir bracket -->
<path d="M550 262 L550 270 L1120 270 L1120 262" fill="none" stroke="#5B6270" stroke-width="1.5"/>
<text x="835" y="290" font-size="13" fill="#5B6270" text-anchor="middle"><tspan font-family="'IBM Plex Mono', Menlo, monospace" font-weight="500">S_dir = I_higher + S_true</tspan>  ·  left unexplained by the best direct model (a conditional KL divergence plus noise)</text>

<!-- card R -->
<rect x="80" y="326" width="500" height="200" rx="10" fill="#FFFFFF" stroke="#E6E5E1"/>
<text x="104" y="362" font-size="20" font-weight="600" fill="#1B1F26" font-family="'IBM Plex Mono', Menlo, monospace">R(ε) = I_dir / S_tot</text>
<text x="104" y="388" font-size="14" fill="#5B6270">Share of the total output entropy explained directly.</text>
<text x="104" y="408" font-size="14" fill="#5B6270">The number max-ent fits report (&gt; 90% in mouse cortex).</text>
<rect x="104" y="440" width="198" height="26" rx="3" fill="#1A73A8"/>
<rect x="304" y="440" width="88" height="26" rx="3" fill="#D9643A"/>
<rect x="394" y="440" width="152" height="26" rx="3" fill="#C9C8C2"/>
<path d="M104 434 L104 428 L302 428 L302 434" fill="none" stroke="#1A73A8" stroke-width="1.5"/>
<text x="203" y="424" font-size="12" fill="#1A73A8" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">numerator</text>
<path d="M104 472 L104 478 L546 478 L546 472" fill="none" stroke="#1B1F26" stroke-width="1.5"/>
<text x="325" y="496" font-size="12" fill="#1B1F26" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">÷ S_tot  (the denominator is fixed by the output)</text>

<!-- card F -->
<rect x="620" y="326" width="500" height="200" rx="10" fill="#FFFFFF" stroke="#E6E5E1"/>
<text x="644" y="362" font-size="20" font-weight="600" fill="#1B1F26" font-family="'IBM Plex Mono', Menlo, monospace">F(ε) = I_dir / I_avail</text>
<text x="644" y="388" font-size="14" fill="#5B6270">Share of the <tspan font-weight="600" fill="#1B1F26">available</tspan> information that is direct.</text>
<text x="644" y="408" font-size="14" fill="#5B6270">Both numerator and denominator move when the ruler changes.</text>
<rect x="644" y="440" width="198" height="26" rx="3" fill="#1A73A8"/>
<rect x="844" y="440" width="88" height="26" rx="3" fill="#D9643A"/>
<rect x="934" y="440" width="152" height="26" rx="3" fill="#C9C8C2" fill-opacity="0.35"/>
<path d="M644 434 L644 428 L842 428 L842 434" fill="none" stroke="#1A73A8" stroke-width="1.5"/>
<text x="743" y="424" font-size="12" fill="#1A73A8" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">numerator</text>
<path d="M644 472 L644 478 L932 478 L932 472" fill="none" stroke="#1B1F26" stroke-width="1.5"/>
<text x="788" y="496" font-size="12" fill="#1B1F26" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">÷ I_avail  (shrinks under coarse-graining)</text>
<text x="1010" y="459" font-size="11" fill="#5B6270" text-anchor="middle">ignored</text>

<text x="600" y="548" font-size="13" fill="#5B6270" text-anchor="middle">Always  S_tot ≥ S_dir ≥ S_true  and  R ≤ F.  High F says nothing about how much information survived — that is I_avail's job.</text>
</svg>
